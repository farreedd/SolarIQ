# Netlify build configuration for SolarIQ frontend.
# The React app lives in frontend/, so `base` points Netlify there;
# `command` and `publish` are resolved relative to that base.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ / 22.12+
  NODE_VERSION = "22"

# SPA fallback so client-side routes (e.g. /overview) don't 404 on reload.
# (frontend/public/_redirects also covers this; kept here as a safety net.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
